name: Backend security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Order service tests
        run: node --test tests/d1-order-service.test.mjs
      - name: Settlement validation tests
        run: node --test tests/payment-settlement.test.mjs
      - name: Reject unsigned webhook tests
        run: node --test tests/payment-webhook-boundary.test.mjs
      - name: Checkout intake security tests
        run: node --test tests/checkout-intake.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build static storefront
        run: npm run build
