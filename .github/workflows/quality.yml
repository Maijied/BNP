name: BNP quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Cloudflare admin session security
        run: node --test tests/*.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static export
        run: npm run build
      - name: Verify generated store and admin pages
        run: |
          test -f out/index.html
          test -f out/admin/login.html -o -f out/admin/login/index.html
          test -f out/admin/orders.html -o -f out/admin/orders/index.html
          test -f out/admin/settings.html -o -f out/admin/settings/index.html

