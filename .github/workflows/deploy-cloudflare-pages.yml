name: Deploy BNP storefront to Cloudflare Pages
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bnp-pages-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify static export
        run: |
          npm run build
          test -f out/index.html
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$CF_PROJECT" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, and CLOUDFLARE_PAGES_PROJECT variable in the production environment."
            exit 1
          fi
      - run: npm ci
      - name: Build static storefront
        run: npm run build
      - name: Deploy static export and Pages Functions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch=main --commit-dirty=true
      - name: Deployment summary
        run: |
          echo "Published commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages project: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}" >> "$GITHUB_STEP_SUMMARY"
